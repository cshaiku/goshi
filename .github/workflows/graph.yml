name: Graph contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  graph:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Shared protocol and native recovery
        run: go test -count=1 -timeout=180s ./internal/toolbridge
      - name: Race detection
        if: runner.os != 'Windows'
        run: go test -race -count=1 -timeout=180s ./internal/toolbridge
      - name: Native CLI discovery
        run: |
          go run . tools graph capabilities
          go run . tools graph schema --kind workflow
          go run . tools complete -- graph context --stage v
